server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      cors-configurations:
        '[/**]':
          allowedOrigins:
            - "*"
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - PATCH
          allowedHeaders: "*"
          exposedHeaders:
            - Authorization
            - X-User-Email
            - X-User-Role
            - X-Auth-Error
          allowCredentials: true
          maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:
        # --- Standard Routes (with /gateway prefix for Frontend) ---
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/gateway/auth/**
          filters:
            - StripPrefix=1

        - id: timesheet-service
          uri: lb://timesheet-service
          predicates:
            - Path=/gateway/timesheet/**
          filters:
            - StripPrefix=1

        - id: leave-service
          uri: lb://leave-service
          predicates:
            - Path=/gateway/leave/**
          filters:
            - StripPrefix=1

        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/gateway/admin/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/gateway/notification/**
          filters:
            - StripPrefix=1

        # --- Direct Routes (without prefix for Swagger/Testing) ---
        - id: auth-service-direct
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: timesheet-service-direct
          uri: lb://timesheet-service
          predicates:
            - Path=/timesheet/**

        - id: leave-service-direct
          uri: lb://leave-service
          predicates:
            - Path=/leave/**

        - id: admin-service-direct
          uri: lb://admin-service
          predicates:
            - Path=/admin/**

        - id: notification-service-direct
          uri: lb://notification-service
          predicates:
            - Path=/notification/**

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: tms-super-secret-key-must-be-at-least-256-bits-long-for-hmac!!

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /gateway/auth/v3/api-docs
      - name: Timesheet Service
        url: /gateway/timesheet/v3/api-docs
      - name: Leave Service
        url: /gateway/leave/v3/api-docs
      - name: Admin Service
        url: /gateway/admin/v3/api-docs
    urls-primary-name: Auth Service
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    enabled: true
    path: /v3/api-docs
  use-management-port: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: WARN

management:
  endpoints:
    web:
      exposure:
        include: "health,info,gateway"
  endpoint:
    health:
      show-details: always